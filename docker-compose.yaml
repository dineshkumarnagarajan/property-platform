version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: pp_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: propertyplatform
      MYSQL_USER: pp_user
      MYSQL_PASSWORD: pp_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: pp_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: